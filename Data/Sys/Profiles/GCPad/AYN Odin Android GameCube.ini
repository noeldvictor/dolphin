# AYN Thor / Odin Android GameCube pad.
#
# Analog triggers are Axis 23 (AXIS_BRAKE, left) and Axis 22 (AXIS_GAS, right). The pad does
# not expose AXIS_LTRIGGER (17) or AXIS_RTRIGGER (18) at all - its Android motion ranges are
# X, Y, Z, RZ, HAT_X, HAT_Y, GAS, BRAKE - so binding those left the analog travel dead and only
# the digital L2/R2 buttons working. Left/right assignment follows the usual Android convention;
# Left/right on that pair is not a guess: SDL's own Android mapping states that
# AXIS_GAS (22) is the right trigger and AXIS_BRAKE (23) is the left, in
# RangeComparator in Externals/SDL/SDL/android-project/.../SDLControllerManager.java.
# Still swap 22 and 23 here if they ever come out backwards on real hardware.
[Profile]
Buttons/A = `Button A`
Buttons/B = `Button B`
Buttons/X = `Button X`
Buttons/Y = `Button Y`
Buttons/Z = `Button R1`
Buttons/Start = `Start`
Main Stick/Up = `Axis 1-`
Main Stick/Down = `Axis 1+`
Main Stick/Left = `Axis 0-`
Main Stick/Right = `Axis 0+`
Main Stick/Calibration = 100.00
C-Stick/Up = `Axis 14-`
C-Stick/Down = `Axis 14+`
C-Stick/Left = `Axis 11-`
C-Stick/Right = `Axis 11+`
C-Stick/Calibration = 100.00
Triggers/L = `Button L2` | `Axis 23+`
Triggers/R = `Button R2` | `Axis 22+`
Triggers/L-Analog = `Axis 23+`
Triggers/R-Analog = `Axis 22+`
D-Pad/Up = `Up`
D-Pad/Down = `Down`
D-Pad/Left = `Left`
D-Pad/Right = `Right`
Rumble/Motor = `Android/0/Device Sensors:Motor 0`
