Classic/Buttons/Y = `Button Y`
Classic/Buttons/ZL = `Button L2`
Classic/Buttons/ZR = `Button R2`
Classic/Buttons/- = `Select`
Classic/Buttons/+ = `Start`
Classic/Buttons/Home = `Mode`
