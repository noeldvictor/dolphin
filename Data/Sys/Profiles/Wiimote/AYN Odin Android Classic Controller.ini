# AYN Thor / Odin Android Classic Controller.
#
# Analog triggers are Axis 23 (AXIS_BRAKE, left) and Axis 22 (AXIS_GAS, right); this pad has no
# AXIS_LTRIGGER/AXIS_RTRIGGER. The left/right assignment follows SDL's Android
# mapping, which documents AXIS_GAS as the right trigger and AXIS_BRAKE as the left.
[Profile]
Buttons/A = `Button A`
Buttons/B = `Button B`
Buttons/1 = `Button X`
Buttons/2 = `Button Y`
Buttons/- = `Select`
Buttons/+ = `Start`
Buttons/Home = `Mode`
D-Pad/Up = `Up`
D-Pad/Down = `Down`
D-Pad/Left = `Left`
D-Pad/Right = `Right`
Extension = Classic
Classic/Buttons/A = `Button A`
Classic/Buttons/B = `Button B`
