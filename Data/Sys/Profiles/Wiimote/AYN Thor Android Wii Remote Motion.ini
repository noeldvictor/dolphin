# Wii Remote with motion controls driven by the AYN Thor's built-in gyroscope
# and accelerometer, for games that want you to tilt, steer or point.
#
# The Thor's sensors are exposed by Dolphin as the "Android/0/Device Sensors"
# device, which is separate from the device the face buttons come from - that is
# why the IMU entries below are fully qualified while the buttons are not.
#
# IMUIR gives motion pointing without a sensor bar. It drifts, because the Thor
# has a gyroscope but no magnetometer and therefore no absolute heading, so
# Recenter is mapped to the Select + R1 chord to straighten the pointer out.
[Profile]
Buttons/A = `Button A`
Buttons/B = `Button B`
Buttons/1 = `Button X`
Buttons/2 = `Button Y`
Buttons/- = `Select`
Buttons/+ = `Start`
Buttons/Home = `Mode`
D-Pad/Up = `Up`
D-Pad/Down = `Down`
D-Pad/Left = `Left`
D-Pad/Right = `Right`
IMUAccelerometer/Up = `Android/0/Device Sensors:Accel Up`
IMUAccelerometer/Down = `Android/0/Device Sensors:Accel Down`
IMUAccelerometer/Left = `Android/0/Device Sensors:Accel Left`
IMUAccelerometer/Right = `Android/0/Device Sensors:Accel Right`
IMUAccelerometer/Forward = `Android/0/Device Sensors:Accel Forward`
IMUAccelerometer/Backward = `Android/0/Device Sensors:Accel Backward`
IMUGyroscope/Pitch Up = `Android/0/Device Sensors:Gyro Pitch Up`
IMUGyroscope/Pitch Down = `Android/0/Device Sensors:Gyro Pitch Down`
IMUGyroscope/Roll Left = `Android/0/Device Sensors:Gyro Roll Left`
IMUGyroscope/Roll Right = `Android/0/Device Sensors:Gyro Roll Right`
IMUGyroscope/Yaw Left = `Android/0/Device Sensors:Gyro Yaw Left`
IMUGyroscope/Yaw Right = `Android/0/Device Sensors:Gyro Yaw Right`
IMUGyroscope/Dead Zone = 3
IMUIR/Enabled = True
IMUIR/Recenter = @(`Select`+`Button R1`)
IMUIR/Total Yaw = 25
Extension = None
Rumble/Motor = `Android/0/Device Sensors:Motor 0`
